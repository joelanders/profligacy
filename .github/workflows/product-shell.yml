name: Product shell CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out pinned JUCE only
        run: git submodule update --init --depth 1 extern/JUCE
      - name: Configure product shell
        run: >-
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DPROPHECY_USE_FAKE_ENGINE=ON
          -DPROPHECY_COPY_PLUGIN_AFTER_BUILD=OFF
          -DBUILD_TESTING=OFF
      - name: Build AU, VST3, standalone, and artifact host
        run: >-
          cmake --build build --parallel 4 --target
          ProphecyPlugin_AU
          ProphecyPlugin_VST3
          ProphecyPlugin_Standalone
          ProphecyArtifactHost
      - name: Verify native arm64 products
        run: |
          for binary in \
            build/ProphecyPlugin_artefacts/Release/AU/Profligacy.component/Contents/MacOS/Profligacy \
            build/ProphecyPlugin_artefacts/Release/VST3/Profligacy.vst3/Contents/MacOS/Profligacy \
            build/ProphecyPlugin_artefacts/Release/Standalone/Profligacy.app/Contents/MacOS/Profligacy
          do
            test "$(lipo -archs "$binary")" = arm64
          done
      - name: Load and process the packaged VST3 without ROMs
        env:
          PROPHECY_FORCE_NO_ROM: "1"
        run: >-
          build/ProphecyArtifactHost_artefacts/Release/ProphecyArtifactHost
          --plugin build/ProphecyPlugin_artefacts/Release/VST3/Profligacy.vst3
          --receipt "$RUNNER_TEMP/product-shell-macos-arm64.json"
          --wav "$RUNNER_TEMP/product-shell-macos-arm64.wav"
          --seconds 1
      - name: Run MAME-independent publication checks
        run: >-
          python3 -B -m unittest
          scripts/test_alpha_release_policy.py
          scripts/test_build_ci_probe_roms.py
          scripts/test_product_identity.py
          scripts/test_release_licensing.py
          scripts/test_run_ci_rom_e2e.py

  shell-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out pinned JUCE only
        run: git submodule update --init --depth 1 extern/JUCE
      - name: Install pinned WebView2 SDK
        shell: pwsh
        run: >-
          nuget install Microsoft.Web.WebView2
          -Version 1.0.3485.44
          -OutputDirectory "$env:RUNNER_TEMP/nuget"
          -NonInteractive
      - name: Ensure WebView2 Runtime is installed
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $machineKey = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client"
          $userKey = "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
          function Get-WebView2Version {
            @(
              (Get-ItemProperty -LiteralPath $machineKey -ErrorAction SilentlyContinue).pv
              (Get-ItemProperty -LiteralPath $userKey -ErrorAction SilentlyContinue).pv
            ) | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          }
          $version = Get-WebView2Version
          if (-not $version) {
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $install = Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 Runtime installer exited $($install.ExitCode)" }
            $version = Get-WebView2Version
          }
          if (-not $version) { throw 'WebView2 Runtime is unavailable after installation' }
          Write-Host "WebView2 Runtime $version"

      - name: Configure product shell
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DPROPHECY_USE_FAKE_ENGINE=ON
          -DPROPHECY_COPY_PLUGIN_AFTER_BUILD=OFF
          -DBUILD_TESTING=OFF
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:RUNNER_TEMP/nuget"
      - name: Build VST3, standalone, and artifact host
        run: >-
          cmake --build build --config Release --parallel 4 --target
          ProphecyPlugin_VST3
          ProphecyPlugin_Standalone
          ProphecyArtifactHost
      - name: Open the standalone editor through WebView2
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'profligacy-standalone-editor-ready.txt'
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          $env:PROPHECY_FORCE_NO_ROM = '1'
          $env:PROFLIGACY_EDITOR_SMOKE = '1'
          $env:PROFLIGACY_EDITOR_SMOKE_RECEIPT = $marker
          $standalone = Start-Process -FilePath 'build\ProphecyPlugin_artefacts\Release\Standalone\Profligacy.exe' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $marker)) {
              if ($standalone.HasExited) {
                throw "standalone exited before its editor became ready (exit $($standalone.ExitCode))"
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not (Test-Path -LiteralPath $marker)) {
              throw 'standalone editor did not load its embedded page and native bridge within 20 seconds'
            }
            $receipt = (Get-Content -LiteralPath $marker -Raw).Trim()
            if ($receipt -ne 'profligacy-editor-v1') {
              throw "unexpected standalone editor receipt: $receipt"
            }
            Write-Host 'standalone editor_ready=true'
          }
          finally {
            if (-not $standalone.HasExited) {
              Stop-Process -Id $standalone.Id -Force
              $standalone.WaitForExit()
            }
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          }
      - name: Load, open, and process the packaged VST3 without ROMs
        shell: pwsh
        run: |
          $env:PROPHECY_FORCE_NO_ROM = '1'
          & build\ProphecyArtifactHost_artefacts\Release\ProphecyArtifactHost.exe `
            --plugin build\ProphecyPlugin_artefacts\Release\VST3\Profligacy.vst3 `
            --receipt "$env:RUNNER_TEMP\product-shell-windows-x64.json" `
            --wav "$env:RUNNER_TEMP\product-shell-windows-x64.wav" `
            --require-editor `
            --editor-timeout 30 `
            --seconds 1
          if ($LASTEXITCODE -ne 0) { throw "artifact host exited $LASTEXITCODE" }
      - name: Run clean-room ROM and receipt unit tests
        run: >-
          python -B -m unittest
          scripts/test_alpha_release_policy.py
          scripts/test_build_ci_probe_roms.py
          scripts/test_run_ci_rom_e2e.py
